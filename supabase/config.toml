# Supabase CLI settings for the Zermatt Lodge booking functions (project eli-hub, kddhkuwnkkjcnbjegsmc).
# All booking tables live in the private `zermatt` schema - nothing in `public` is touched.
project_id = "kddhkuwnkkjcnbjegsmc"

# Public read-only / own checks:
[functions.zermatt-availability]
verify_jwt = false

[functions.zermatt-ical-export]
verify_jwt = false

# Stripe signature is checked in code
[functions.zermatt-stripe-webhook]
verify_jwt = false

# Public endpoint with strict input checks and CORS limited to the live site + localhost
[functions.zermatt-create-checkout]
verify_jwt = false

# Called by pg_cron with the anon key + x-cron-secret
[functions.zermatt-sync-availability]
verify_jwt = true

# Exit-intent popup sign-ups: public, own input checks, rate limits and CORS
[functions.zermatt-signup]
verify_jwt = false

# Admin "Resend confirmation": verifies the user's token and zermatt.admins membership in code
[functions.zermatt-admin-resend]
verify_jwt = false

# Thank-you page status check: read-only, status + dates only, looked up by the guest's own Checkout session id
[functions.zermatt-booking-status]
verify_jwt = false

# Book Homes marketplace: every function checks its own caller (user token, Stripe signature, cron secret or ical token)
[functions.bookhomes-availability]
verify_jwt = false
[functions.bookhomes-listings]
verify_jwt = false
[functions.bookhomes-create-checkout]
verify_jwt = false
[functions.bookhomes-stripe-webhook]
verify_jwt = false
[functions.bookhomes-ical-export]
verify_jwt = false
[functions.bookhomes-ical-sync]
verify_jwt = false
[functions.bookhomes-host-signup]
verify_jwt = false
[functions.bookhomes-host]
verify_jwt = false
[functions.bookhomes-admin]
verify_jwt = false
[functions.bookhomes-connect-onboard]
verify_jwt = false
