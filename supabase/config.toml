# Supabase CLI settings for the Zermatt Lodge booking backend.
# If `supabase init` has already created a fuller config.toml, just copy the
# [functions.*] blocks below into it.
project_id = "zermatt-lodge"

# These functions are called by the website, Stripe, the OTAs or pg_cron,
# none of which send a Supabase login token. Each one checks its own access:
#   stripe-webhook     -> Stripe signature (STRIPE_WEBHOOK_SECRET)
#   sync-availability  -> x-cron-secret header (CRON_SECRET)
#   ical-export        -> optional ?token= (ICAL_EXPORT_TOKEN)
#   availability, create-checkout -> public by design, no secrets returned
[functions.create-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.ical-export]
verify_jwt = false

[functions.sync-availability]
verify_jwt = false

[functions.availability]
verify_jwt = false
