# Supabase CLI settings for the Zermatt Lodge booking functions (project eli-hub, kddhkuwnkkjcnbjegsmc).
# All booking tables live in the private `zermatt` schema - nothing in `public` is touched.
project_id = "kddhkuwnkkjcnbjegsmc"

# Public read-only / own checks:
[functions.zermatt-availability]
verify_jwt = false

[functions.zermatt-ical-export]
verify_jwt = false

# Stripe signature is checked in code
[functions.zermatt-stripe-webhook]
verify_jwt = false

# Public endpoint with strict input checks and CORS limited to the live site + localhost
[functions.zermatt-create-checkout]
verify_jwt = false

# Called by pg_cron with the anon key + x-cron-secret
[functions.zermatt-sync-availability]
verify_jwt = true
