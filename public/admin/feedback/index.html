<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f4d3a">
<title>Feedback &amp; bugs | Book Homes admin</title>
<style>
:root{
  --ink:#1b1f1d; --muted:#5d6560; --line:#e7e3dc; --soft:#f7f4ef; --cream:#fbf8f3;
  --brand:#1f4d3a; --brand-2:#2c6a50; --brand-ink:#163a2b; --brand-tint:#e9f1ec; --mine:#dcefe3;
  --accent:#c8873a; --accent-ink:#8a5a1f; --accent-tint:#f8efe3; --red:#b42318; --red-tint:#fdeceb;
  --blue:#1d4ed8; --blue-tint:#e8efff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#efeae2;line-height:1.45;font-size:15px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.top{flex:none;position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:6px 10px calc(6px) 6px;padding-top:max(6px, env(safe-area-inset-top));display:flex;align-items:center;gap:8px;min-height:56px}
.top a.back,.top button{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:10px;color:#fff;text-decoration:none;background:transparent;border:0;font-size:22px}
.top a.back:hover,.top button:hover{background:rgba(255,255,255,.12)}
.top .t{flex:1;min-width:0}
.top h1{font-size:17px;font-weight:700;line-height:1.2}
.top .sub{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{flex:none;display:flex;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;min-height:36px}
.filters button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
#chat{flex:1;overflow-y:auto;padding:12px 10px 16px;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto}
.day{text-align:center;margin:10px 0}
.day span{display:inline-block;background:#fff;color:var(--muted);font-size:12px;font-weight:600;border-radius:8px;padding:3px 10px;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.item{margin:0 0 14px}
.b{position:relative;max-width:86%;border-radius:12px;padding:8px 10px 6px;box-shadow:0 1px 1px rgba(0,0,0,.08);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.b.me{margin-left:auto;background:var(--mine);border-top-right-radius:4px}
.b.ag{margin-right:auto;background:#fff;border-top-left-radius:4px}
.b + .b{margin-top:4px}
.b .who{display:block;font-size:12px;font-weight:700;color:var(--accent-ink);margin-bottom:2px;white-space:normal}
.b .meta{display:flex;gap:6px;justify-content:flex-end;align-items:center;font-size:11.5px;color:var(--muted);margin-top:4px;white-space:normal}
.head{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:5px;white-space:normal}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;line-height:20px;white-space:nowrap}
.k-bug{background:var(--red-tint);color:var(--red)}
.k-improvement{background:var(--blue-tint);color:var(--blue)}
.k-question{background:var(--soft);color:var(--muted)}
.s-new{background:var(--accent-tint);color:var(--accent-ink)}
.s-triaged{background:var(--blue-tint);color:var(--blue)}
.s-in_progress{background:#fff4cc;color:#7a5b00}
.s-done{background:var(--brand);color:#fff}
.s-wont_do{background:#e5e5e5;color:#444}
.pri{background:#fff;border:1px solid var(--line);color:var(--ink)}
.team{background:transparent;color:var(--muted);font-weight:600;padding:1px 4px}
.page{display:block;font-size:12.5px;color:var(--brand);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot{display:block;margin-top:6px}
.shot img{display:block;max-width:220px;max-height:260px;width:auto;border-radius:8px;border:1px solid var(--line);background:#fff}
.replybtn{display:block;margin:4px 0 0 auto;border:0;background:transparent;color:var(--brand);font-weight:600;font-size:13px;padding:6px 4px;min-height:32px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.err{background:var(--red-tint);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.ok{background:var(--brand-tint);color:var(--brand);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
/* composer */
.comp{flex:none;background:#f0ede8;border-top:1px solid var(--line);padding:8px 8px max(8px, env(safe-area-inset-bottom))}
.comp .inner{max-width:760px;margin:0 auto}
.ctx{display:flex;align-items:center;gap:8px;background:#fff;border-left:4px solid var(--brand);border-radius:8px;padding:6px 6px 6px 10px;margin-bottom:6px;font-size:13px}
.ctx .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ctx .x b{color:var(--ink)}
.ctx button{border:0;background:transparent;min-width:36px;min-height:36px;border-radius:8px;font-size:18px;color:var(--muted)}
.ctx img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.kinds{display:flex;gap:6px;margin-bottom:6px}
.kinds button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-weight:700;font-size:14px;min-height:38px;color:var(--muted)}
.kinds button[aria-pressed="true"][data-kind="bug"]{border-color:var(--red);background:var(--red-tint);color:var(--red)}
.kinds button[aria-pressed="true"][data-kind="improvement"]{border-color:var(--blue);background:var(--blue-tint);color:var(--blue)}
.row{display:flex;align-items:flex-end;gap:6px}
.row .box{flex:1;display:flex;align-items:flex-end;background:#fff;border-radius:22px;padding:2px 4px 2px 14px;min-height:46px}
.row textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font-size:16px;line-height:1.35;padding:11px 0;max-height:140px;min-height:42px}
.row .att{border:0;background:transparent;min-width:42px;min-height:42px;border-radius:50%;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.row .att svg,.row .send svg{width:22px;height:22px}
.row .send{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.row .send:disabled{opacity:.55;cursor:not-allowed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* sign in */
.gate{max-width:440px;margin:40px auto;padding:0 14px}
.gate .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.08)}
.gate h2{font-size:18px;margin-bottom:8px;color:var(--brand-ink)}
.gate p{color:var(--muted);margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;width:100%;background:var(--brand);color:#fff;border:0;border-radius:10px;font-weight:700;font-size:16px;text-decoration:none}
@media (min-width:760px){ .b{max-width:72%} #chat{padding:16px} }
</style>
</head>
<body>
<header class="top">
  <a class="back" href="/admin/" aria-label="Back to admin">&#8249;</a>
  <div class="t"><h1>Feedback &amp; bugs</h1><div class="sub" id="sub">Tell the build team what to fix or improve</div></div>
  <button type="button" id="refresh" aria-label="Refresh">&#8635;</button>
</header>

<div id="gate" class="gate hidden">
  <div class="card">
    <h2>Sign in to admin first</h2>
    <p id="gateText">This page uses your admin sign-in (password and 6-digit code). Sign in, and you'll come straight back here.</p>
    <a class="btn" href="/admin/" id="gateBtn">Sign in</a>
  </div>
</div>

<nav class="filters hidden" id="filters" aria-label="Show">
  <button type="button" data-f="open" aria-pressed="true">Open</button>
  <button type="button" data-f="done" aria-pressed="false">Done</button>
  <button type="button" data-f="all" aria-pressed="false">All</button>
</nav>

<main id="chat" class="hidden" aria-live="polite"><div class="wrap" id="list"><div class="empty">Loading...</div></div></main>

<form class="comp hidden" id="comp" novalidate>
  <div class="inner">
    <div id="err"></div>
    <div class="ctx hidden" id="replyCtx"><div class="x">Replying to <b id="replyTo"></b></div><button type="button" id="replyX" aria-label="Cancel reply">&#215;</button></div>
    <div class="ctx hidden" id="pageCtx"><div class="x">Page: <b id="pageUrl"></b></div><button type="button" id="pageX" aria-label="Remove page link">&#215;</button></div>
    <div class="ctx hidden" id="shotCtx"><img id="shotPrev" alt=""><div class="x" id="shotName">Screenshot</div><button type="button" id="shotX" aria-label="Remove screenshot">&#215;</button></div>
    <div class="kinds" id="kinds" role="group" aria-label="Type">
      <button type="button" data-kind="bug" aria-pressed="true">Bug</button>
      <button type="button" data-kind="improvement" aria-pressed="false">Improvement</button>
    </div>
    <div class="row">
      <div class="box">
        <label class="sr" for="msg">Message</label>
        <textarea id="msg" rows="1" maxlength="5000" placeholder="Describe the bug or idea..." enterkeyhint="send"></textarea>
        <label class="att" id="attLbl" title="Attach screenshot">
          <span class="sr">Attach screenshot</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          <input type="file" id="file" accept="image/*" class="sr">
        </label>
      </div>
      <button class="send" type="submit" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4l17.4-7.5a1 1 0 0 0 0-1.8L3.4 3.6a1 1 0 0 0-1.4 1.1L4 11l9 1-9 1-2 6.3a1 1 0 0 0 1.4 1.1z"/></svg></button>
    </div>
  </div>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
// Same sign-in as /admin: the session it saved (sessionStorage, or localStorage on a trusted browser) is reused here.
// Every read and write goes through the bookhomes-feedback function, which checks 2-step verification (aal2) and the admin list.
var SUPABASE_URL = "https://kddhkuwnkkjcnbjegsmc.supabase.co";
var SUPABASE_KEY = "sb_publishable_zASd1ua4ZuknbOatR4MnTA_nVwqRZlR";
var FN = SUPABASE_URL + "/functions/v1/bookhomes-feedback";
var RETURN_KEY = "bh_fb_return";

var $ = function(s){ return document.querySelector(s); };
var $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function show(el, on){ $(el).classList.toggle("hidden", !on); }
function errMsg(t){ $("#err").innerHTML = t ? '<div class="err">' + esc(t) + '</div>' : ""; }

var fmtTime = new Intl.DateTimeFormat("en-GB", {hour: "2-digit", minute: "2-digit", timeZone: "Europe/London"});
var fmtDay = new Intl.DateTimeFormat("en-GB", {weekday: "short", day: "numeric", month: "short", timeZone: "Europe/London"});
function dayLabel(s){
  var d = fmtDay.format(new Date(s));
  if (d === fmtDay.format(new Date())) return "Today";
  if (d === fmtDay.format(new Date(Date.now() - 864e5))) return "Yesterday";
  return d;
}
var STATUS = {new: "New", triaged: "Triaged", in_progress: "In progress", done: "Done", wont_do: "Won't do"};
var KIND = {bug: "Bug", improvement: "Improvement", question: "Question"};
var TEAM = {backend: "Backend", ux: "UX", optimiser: "Optimiser", content: "Content"};

if (!window.supabase || !window.supabase.createClient){
  document.body.insertAdjacentHTML("beforeend", '<div class="gate"><div class="err">The sign-in library did not load. Check your connection and reload.</div></div>');
  return;
}

/* ---------- reuse the /admin session without clearing anything ---------- */
function probe(n){ try { var s = window[n]; s.setItem("__bh", "1"); s.removeItem("__bh"); return s; } catch (e) { return null; } }
var LS = probe("localStorage"), SS = probe("sessionStorage"), MEM = {};
function trusted(){ try { var v = JSON.parse((LS && LS.getItem("bh_admin_trust")) || "null"); return !!(v && v.until > Date.now()); } catch (e) { return false; } }
var PRIMARY = trusted() ? LS : SS, OTHER = PRIMARY === LS ? SS : LS;
var authStorage = {
  getItem: function(k){
    try { var v = PRIMARY && PRIMARY.getItem(k); if (v) return v; v = OTHER && OTHER.getItem(k); if (v) return v; } catch (e) {}
    return Object.prototype.hasOwnProperty.call(MEM, k) ? MEM[k] : null;
  },
  setItem: function(k, v){
    try { var where = (OTHER && OTHER.getItem(k) && !(PRIMARY && PRIMARY.getItem(k))) ? OTHER : PRIMARY; if (where) where.setItem(k, v); else MEM[k] = String(v); } catch (e) { MEM[k] = String(v); }
  },
  removeItem: function(k){ [LS, SS].forEach(function(s){ try { if (s) s.removeItem(k); } catch (e) {} }); delete MEM[k]; }
};
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storage: authStorage}
});
function claims(tok){
  try {
    var p = tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); while (p.length % 4) p += "=";
    return JSON.parse(decodeURIComponent(Array.prototype.map.call(atob(p), function(c){ return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2); }).join("")));
  } catch (e) { return {}; }
}

function gate(text){
  show("#gate", true); show("#filters", false); show("#chat", false); show("#comp", false);
  if (text) $("#gateText").textContent = text;
}
$("#gateBtn").addEventListener("click", function(){ try { if (SS) SS.setItem(RETURN_KEY, location.href); } catch (e) {} });

function api(body){
  return sb.auth.getSession().then(function(r){
    var s = r.data && r.data.session;
    if (!s) { var e = new Error("signin"); e.status = 401; throw e; }
    return fetch(FN, {method: "POST", headers: {"Content-Type": "application/json", "Authorization": "Bearer " + s.access_token, "apikey": SUPABASE_KEY}, body: JSON.stringify(body)});
  }).then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(j){
      if (!res.ok){ var e = new Error(j.error || ("Error " + res.status)); e.status = res.status; throw e; }
      return j;
    });
  });
}

/* ---------- state ---------- */
var ITEMS = [], FILTER = "open", KINDSEL = "bug", REPLY = null, PAGE = "", SHOT = null, SENDING = false, LAST_SIG = "";
(function(){
  var q = new URLSearchParams(location.search);
  var p = q.get("page") || "";
  if (/^https?:\/\//i.test(p)) PAGE = p.slice(0, 2000);
  var k = q.get("kind"); if (k === "improvement" || k === "bug") KINDSEL = k;
  if (q.toString()) history.replaceState(null, "", location.pathname);
})();

function setKind(k){ KINDSEL = k; $$("#kinds button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.kind === k ? "true" : "false"); }); }
function refreshCtx(){
  show("#replyCtx", !!REPLY); show("#kinds", !REPLY);
  if (REPLY){ var it = ITEMS.filter(function(i){ return i.id === REPLY; })[0]; $("#replyTo").textContent = it ? it.message.slice(0, 80) : ""; }
  show("#pageCtx", !!PAGE && !REPLY); $("#pageUrl").textContent = PAGE.replace(/^https?:\/\/(www\.)?/, "");
  show("#shotCtx", !!SHOT && !REPLY);
  $("#attLbl").classList.toggle("hidden", !!REPLY);
  $("#msg").placeholder = REPLY ? "Write a reply..." : (KINDSEL === "bug" ? "What went wrong?" : "What should be better?");
}
setKind(KINDSEL);

function visible(){
  return ITEMS.filter(function(i){
    var closed = i.status === "done" || i.status === "wont_do";
    return FILTER === "all" || (FILTER === "done" ? closed : !closed);
  }).sort(function(a, b){ return a.created_at < b.created_at ? -1 : 1; });
}

function bubble(it){
  var head = '<span class="head"><span class="chip k-' + esc(it.kind) + '">' + esc(KIND[it.kind] || it.kind) + '</span>' +
    '<span class="chip s-' + esc(it.status) + '">' + esc(STATUS[it.status] || it.status) + '</span>' +
    (it.priority ? '<span class="chip pri">' + esc(it.priority) + '</span>' : "") +
    ((it.assigned_to || []).length ? '<span class="chip team">' + esc(it.assigned_to.map(function(t){ return TEAM[t] || t; }).join(" + ")) + '</span>' : "") + '</span>';
  var page = it.page_url ? '<a class="page" href="' + esc(it.page_url) + '" target="_blank" rel="noopener">' + esc(it.page_url.replace(/^https?:\/\/(www\.)?/, "")) + '</a>' : "";
  var shot = it.screenshot_url ? '<a class="shot" href="' + esc(it.screenshot_url) + '" target="_blank" rel="noopener"><img src="' + esc(it.screenshot_url) + '" alt="Screenshot" loading="lazy"></a>' : "";
  var h = '<div class="b me">' + head + esc(it.message) + page + shot + '<span class="meta">' + esc(fmtTime.format(new Date(it.created_at))) + '</span></div>';
  var msgs = it.messages || [];
  // Older agent reply stored only in agent_reply (no thread row): show it as the first agent message.
  if (it.agent_reply && !msgs.some(function(m){ return m.author === "agent"; })) msgs = [{author: "agent", body: it.agent_reply, created_at: it.updated_at}].concat(msgs);
  msgs.forEach(function(m){
    var mine = m.author === "eli";
    h += '<div class="b ' + (mine ? "me" : "ag") + '">' + (mine ? "" : '<span class="who">Build team</span>') + esc(m.body) +
      '<span class="meta">' + esc(fmtTime.format(new Date(m.created_at))) + '</span></div>';
  });
  h += '<button type="button" class="replybtn" data-reply="' + esc(it.id) + '">Reply</button>';
  return '<div class="item" id="i-' + esc(it.id) + '">' + h + '</div>';
}

function render(stick){
  var el = $("#chat"), atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  var list = visible(), html = "", lastDay = "";
  list.forEach(function(it){
    var d = dayLabel(it.created_at);
    if (d !== lastDay){ html += '<div class="day"><span>' + esc(d) + '</span></div>'; lastDay = d; }
    html += bubble(it);
  });
  if (!list.length) html = '<div class="empty"><b>' + (FILTER === "done" ? "Nothing finished yet" : "No open items") + '</b>' + (FILTER === "open" ? "Type below to report a bug or ask for an improvement." : "") + '</div>';
  $("#list").innerHTML = html;
  var open = ITEMS.filter(function(i){ return i.status !== "done" && i.status !== "wont_do"; }).length;
  $("#sub").textContent = open + " open, " + (ITEMS.length - open) + " done";
  if (stick || atBottom) el.scrollTop = el.scrollHeight;
}

function load(stick){
  return api({action: "list", status: "all"}).then(function(j){
    ITEMS = j.items || [];
    var sig = JSON.stringify(ITEMS.map(function(i){ return [i.id, i.status, i.updated_at, (i.messages || []).length]; }));
    if (sig !== LAST_SIG || stick){ LAST_SIG = sig; render(stick); }
    show("#gate", false); show("#filters", true); show("#chat", true); show("#comp", true);
  }).catch(function(e){
    if (e.status === 401 || e.status === 403) gate(e.status === 403 && /2-step/.test(e.message) ? "Enter your 6-digit code on the admin page, then you'll come straight back here." : e.status === 403 ? "This account isn't on the admin list." : null);
    else { show("#chat", true); $("#list").innerHTML = '<div class="err">Could not load: ' + esc(e.message) + '</div>'; }
  });
}

/* ---------- screenshot: shrink big phone photos before upload ---------- */
function shrink(file){
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.2e6 || !window.createImageBitmap) return Promise.resolve(file);
  return createImageBitmap(file).then(function(bmp){
    var max = 2000, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    var c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(function(res){ c.toBlob(function(b){ res(b && b.size < file.size ? b : file); }, "image/jpeg", 0.85); });
  }).catch(function(){ return file; });
}
$("#file").addEventListener("change", function(){
  var f = this.files && this.files[0]; this.value = "";
  if (!f) return;
  if (!/^image\//.test(f.type)){ errMsg("Please pick an image."); return; }
  errMsg("");
  shrink(f).then(function(b){
    if (b.size > 10 * 1024 * 1024){ errMsg("That image is over 10 MB. Try a screenshot instead of a photo."); return; }
    SHOT = b; $("#shotName").textContent = "Screenshot attached";
    try { $("#shotPrev").src = URL.createObjectURL(b); } catch (e) {}
    refreshCtx();
  });
});
$("#shotX").addEventListener("click", function(){ SHOT = null; refreshCtx(); });
$("#pageX").addEventListener("click", function(){ PAGE = ""; refreshCtx(); });
$("#replyX").addEventListener("click", function(){ REPLY = null; refreshCtx(); });
$$("#kinds button").forEach(function(b){ b.addEventListener("click", function(){ setKind(b.dataset.kind); refreshCtx(); }); });
$$("#filters button").forEach(function(b){ b.addEventListener("click", function(){
  FILTER = b.dataset.f; $$("#filters button").forEach(function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); render(true);
}); });
$("#list").addEventListener("click", function(e){
  var b = e.target.closest("[data-reply]"); if (!b) return;
  REPLY = b.dataset.reply; refreshCtx(); $("#msg").focus();
});
$("#refresh").addEventListener("click", function(){ load(false); });

var ta = $("#msg");
function grow(){ ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; }
ta.addEventListener("input", grow);
ta.addEventListener("keydown", function(e){
  // Enter sends on desktop; on phones Enter adds a new line and the send button sends.
  if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(pointer:fine)").matches){ e.preventDefault(); $("#comp").requestSubmit ? $("#comp").requestSubmit() : submit(); }
});

function upload(blob){
  var type = blob.type || "image/jpeg";
  return api({action: "upload_url", content_type: type}).then(function(u){
    return sb.storage.from("feedback").uploadToSignedUrl(u.path, u.token, blob, {contentType: type}).then(function(r){
      if (r.error) throw new Error("Screenshot upload failed: " + r.error.message);
      return u.path;
    });
  });
}

function submit(){
  if (SENDING) return;
  var text = ta.value.trim();
  if (!text){ errMsg(REPLY ? "Type a reply first." : "Type a message first."); ta.focus(); return; }
  SENDING = true; $("#send").disabled = true; errMsg("");
  var p;
  if (REPLY) p = api({action: "reply", id: REPLY, body: text});
  else p = (SHOT ? upload(SHOT) : Promise.resolve(null)).then(function(path){
    return api({action: "create", kind: KINDSEL, message: text, page_url: PAGE || null, screenshot_path: path});
  });
  p.then(function(){
    ta.value = ""; grow(); SHOT = null; PAGE = ""; REPLY = null; refreshCtx();
    if (FILTER === "done") { FILTER = "open"; $$("#filters button").forEach(function(x){ x.setAttribute("aria-pressed", x.dataset.f === "open" ? "true" : "false"); }); }
    return load(true);
  }).catch(function(e){ errMsg(e.status === 401 ? "You've been signed out. Sign in again, your message is still here." : e.message); if (e.status === 401 || e.status === 403) setTimeout(function(){ gate(); }, 1500); })
    .then(function(){ SENDING = false; $("#send").disabled = false; });
}
$("#comp").addEventListener("submit", function(e){ e.preventDefault(); submit(); });

/* ---------- start ---------- */
sb.auth.getSession().then(function(r){
  var s = r.data && r.data.session;
  if (!s) return gate();
  if (claims(s.access_token).aal !== "aal2") return gate("Enter your 6-digit code on the admin page, then you'll come straight back here.");
  refreshCtx();
  return load(true);
});
// Check for new replies from the build team every 30 seconds while the page is open.
setInterval(function(){ if (document.visibilityState === "visible" && !$("#chat").classList.contains("hidden")) load(false); }, 30000);
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible" && !$("#chat").classList.contains("hidden")) load(false); });
})();
</script>
</body>
</html>
