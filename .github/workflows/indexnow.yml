name: IndexNow ping
# After a push to main changes the public site, wait for the Vercel deploy, then tell IndexNow
# (Bing and other engines) which pages changed. Run it by hand with "all" to submit the full sitemap.
on:
  push:
    branches: [main]
    paths: ["public/**"]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every sitemap URL"
        type: boolean
        default: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for the Vercel deploy to go live
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://bookhomes.co.uk/00d622ef355b6708bc52633c7be81118.txt" | grep -q 00d622ef355b6708bc52633c7be81118; then break; fi
            sleep 15
          done
          sleep 60
      - name: Ping IndexNow
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.all }}" = "true" ]; then
            python3 scripts/indexnow.py --all
          else
            python3 scripts/indexnow.py "${{ github.event.before }}..${{ github.sha }}" || python3 scripts/indexnow.py HEAD~1..HEAD
          fi
